name: ALL CAST V16 visual concept previews
on:
  workflow_dispatch:
  push:
    branches: [preview/allcast-v16-visual-options]
    paths: [tests/allcast-concept-preview.mjs, .github/workflows/allcast-visual-preview.yml]
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/allcast-concept-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allcast-v16-design-variants
          path: allcast-design-review/*
          if-no-files-found: ignore
