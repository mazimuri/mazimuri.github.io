name: EDIT CROP preview parity
on:
  pull_request:
    branches: [main]
    paths:
      - admin.js
      - admin.html
      - admin-v15-studio.css
      - tests/admin-crop-parity.mjs
      - .github/workflows/admin-crop-parity.yml
  workflow_dispatch:
jobs:
  crop-preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify editor syntax and parity contracts
        run: node tests/admin-crop-parity.mjs
      - name: Install browser dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compare actual CSS computed styles at desktop and mobile sizes
        run: node tests/admin-crop-parity.mjs --browser
