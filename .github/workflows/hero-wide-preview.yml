name: HERO ultrawide typography preview
on:
  pull_request:
    branches: [design/rail-v16-approved-production]
    paths:
      - cast-side-rail.css
      - index.html
      - tests/hero-wide-integrity.mjs
      - tests/hero-wide-compare.mjs
      - .github/workflows/hero-wide-preview.yml
  workflow_dispatch:
jobs:
  hero-preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify adopted Focus CSS against real site (no publication)
        run: node tests/hero-wide-integrity.mjs
      - name: Render original, balanced and bold at 1920 and 2560
        run: node tests/hero-wide-compare.mjs
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-wide-typography-variants
          path: |
            hero-wide-review/*.png
            hero-wide-implementation/*.png
          if-no-files-found: ignore
          retention-days: 14
